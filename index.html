<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSAF Counselling — Appointments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F7F5F0;
    --surface:#FFFFFF;
    --border:#E4E1D8;
    --ink:#1F2A24;
    --muted:#6B6F6C;
    --teal:#2F6F62;
    --teal-light:#E4EFEC;
    --coral:#D97757;
    --coral-light:#FBEAE3;
    --amber:#B8873A;
    --amber-light:#F6EDDD;
    --slate:#5B6B76;
    --slate-light:#E9EEF0;
    --radius:10px;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0;}
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; background:var(--surface); border-bottom:1px solid var(--border);
  }
  header.topbar h1{font-size:20px; letter-spacing:-0.01em;}
  .who{display:flex; align-items:center; gap:14px; font-size:14px; color:var(--muted);}
  .who strong{color:var(--ink); font-weight:500;}
  button{
    font-family:var(--font-body); font-size:14px; font-weight:500;
    border-radius:8px; border:1px solid var(--border); background:var(--surface);
    padding:9px 16px; cursor:pointer; color:var(--ink);
  }
  button.primary{background:var(--teal); color:#fff; border-color:var(--teal);}
  button.primary:hover{background:#255a4f;}
  button.ghost{background:transparent; border-color:transparent; color:var(--muted);}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  main{max-width:880px; margin:0 auto; padding:32px 24px 80px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:24px; margin-bottom:20px;
  }
  label{display:block; font-size:13px; font-weight:500; margin-bottom:6px; color:var(--ink);}
  input, select, textarea{
    width:100%; font-family:var(--font-body); font-size:14px;
    padding:10px 12px; border:1px solid var(--border); border-radius:8px;
    background:#fff; color:var(--ink); margin-bottom:16px;
  }
  textarea{resize:vertical; min-height:70px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .pill{
    display:inline-block; font-size:12px; font-weight:500; padding:3px 10px;
    border-radius:999px; white-space:nowrap;
  }
  .pill.pending{background:var(--slate-light); color:var(--slate);}
  .pill.scheduled{background:var(--amber-light); color:var(--amber);}
  .pill.closed{background:var(--teal-light); color:var(--teal);}
  .pill.cancelled{background:var(--coral-light); color:var(--coral);}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{
    text-align:left; font-weight:500; color:var(--muted); font-size:12px;
    text-transform:uppercase; letter-spacing:0.03em; padding:8px 10px;
    border-bottom:1px solid var(--border);
  }
  td{padding:12px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .empty{color:var(--muted); font-size:14px; padding:20px 0; text-align:center;}
  .error{color:var(--coral); font-size:13px; margin:-8px 0 12px;}
  .success{color:var(--teal); font-size:13px; margin:-8px 0 12px;}
  .tabs{display:flex; gap:4px; margin-bottom:20px;}
  .tabs button{border-radius:8px 8px 0 0; border-bottom:none;}
  .tabs button.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  .sub{color:var(--muted); font-size:13px; margin-top:-4px; margin-bottom:20px;}
  .assign-row{display:flex; gap:10px; align-items:end; flex-wrap:wrap; margin-top:10px;}
  .assign-row > div{flex:1; min-width:120px;}
  .assign-row input, .assign-row select{margin-bottom:0;}
  .center-screen{display:flex; align-items:center; justify-content:center; min-height:90vh;}
  .auth-card{width:380px;}
  .auth-toggle{display:flex; gap:8px; margin-bottom:20px;}
  .auth-toggle button{flex:1;}
  .auth-toggle button.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  .role-badge{
    font-size:11px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--muted); font-weight:600; margin-bottom:2px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const SUPABASE_URL = 'https://twtlfjepxqxdtyiztmxq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XaAK7GnIlR4B9m4ggq8F-g_TGcH2iDR';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROLE_LABELS = {
  student: 'Student',
  teacher: 'Teacher',
  counselling_admin: 'Counselling admin',
  student_admin: 'Student admin',
  counselor: 'Counselor',
  superadmin: 'Superadmin'
};
const REASON_LABELS = {
  emotional_wellbeing: 'Emotional wellbeing',
  anxiety: 'Anxiety',
  other: 'Other'
};

let currentUser = null;
let currentProfile = null;

const app = document.getElementById('app');

function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function fmt(v){ return v ? v : '—'; }
function statusPill(status){ return `<span class="pill ${status}">${status}</span>`; }

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (session){
    currentUser = session.user;
    await loadProfile();
  }
  render();
}

async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if (!error && data) currentProfile = data;
}

sb.auth.onAuthStateChange(async (_event, session) => {
  currentUser = session ? session.user : null;
  if (currentUser) await loadProfile(); else currentProfile = null;
  render();
});

function render(){
  app.innerHTML = '';
  if (!currentUser){
    app.appendChild(renderAuthScreen());
    return;
  }
  if (!currentProfile){
    app.appendChild(renderCompleteProfileScreen());
    return;
  }
  app.appendChild(renderShell());
}

// ---------- AUTH ----------
function renderAuthScreen(){
  const wrap = el(`<div class="center-screen"><div class="card auth-card">
    <h3 style="margin-bottom:16px;">Log in</h3>
    <label>Email</label>
    <input type="email" id="login-email">
    <label>Password</label>
    <input type="password" id="login-password">
    <div class="error" id="login-error" style="display:none;"></div>
    <button class="primary" id="login-btn" style="width:100%;">Log in</button>
    <p class="sub" style="margin-top:16px; margin-bottom:0;">Don't have an account? Ask your system administrator to create one for you.</p>
  </div></div>`);

  wrap.querySelector('#login-btn').onclick = async () => {
    const email = wrap.querySelector('#login-email').value.trim();
    const password = wrap.querySelector('#login-password').value;
    const errEl = wrap.querySelector('#login-error');
    errEl.style.display = 'none';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error){ errEl.textContent = error.message; errEl.style.display = 'block'; return; }
    currentUser = (await sb.auth.getUser()).data.user;
    await loadProfile();
    render();
  };
  return wrap;
}

function renderCompleteProfileScreen(){
  // Session exists but no profile row — this shouldn't normally happen since
  // accounts are created with a profile in one step by the superadmin.
  const wrap = el(`<div class="center-screen"><div class="card auth-card">
    <h3 style="margin-bottom:12px;">Account not fully set up</h3>
    <p class="sub" style="margin-bottom:16px;">Your login worked, but no profile is linked to this account yet. Please contact your system administrator.</p>
    <button class="ghost" id="cp-signout" style="width:100%;">Sign out</button>
  </div></div>`);
  wrap.querySelector('#cp-signout').onclick = async () => {
    await sb.auth.signOut();
    currentUser = null; currentProfile = null;
    render();
  };
  return wrap;
}

// ---------- SHELL ----------
function renderShell(){
  const wrap = el(`<div>
    <header class="topbar">
      <h1>RSAF Counselling</h1>
      <div class="who">
        <div style="text-align:right;">
          <div class="role-badge">${ROLE_LABELS[currentProfile.role]}</div>
          <strong>${currentProfile.name}</strong>
        </div>
        <button class="ghost" id="logout-btn">Sign out</button>
      </div>
    </header>
    <main id="main"></main>
  </div>`);

  wrap.querySelector('#logout-btn').onclick = async () => {
    await sb.auth.signOut();
    currentUser = null; currentProfile = null;
    render();
  };

  const main = wrap.querySelector('#main');
  const role = currentProfile.role;
  if (role === 'student' || role === 'teacher') main.appendChild(RequestFormView());
  else if (role === 'counselling_admin') main.appendChild(AdminDashboardView());
  else if (role === 'student_admin') main.appendChild(StudentAdminListView());
  else if (role === 'counselor') main.appendChild(CounselorView());
  else if (role === 'superadmin') main.appendChild(SuperadminView());
  else main.appendChild(el(`<div class="card">No view configured for this role yet.</div>`));

  return wrap;
}

// ---------- VIEW 1: REQUEST FORM (student / teacher) ----------
const STUDENT_ID_RE = /^[A-Za-z0-9-]{3,}$/;

function RequestFormView(){
  const wrap = el(`<div>
    <div class="card">
      <h2 style="margin-bottom:4px;">Request a counselling session</h2>
      <p class="sub">Fill in the student's details below. The counselling team will confirm a date and time.</p>
      <div class="field-row">
        <div>
          <label>Student ID</label>
          <input type="text" id="rf-sid">
        </div>
        <div>
          <label>Student name</label>
          <input type="text" id="rf-sname">
        </div>
      </div>
      <label>Educational level</label>
      <input type="text" id="rf-level" placeholder="e.g. Year 2, Foundation, etc.">
      <label>Reason for session</label>
      <select id="rf-reason">
        <option value="emotional_wellbeing">Emotional wellbeing</option>
        <option value="anxiety">Anxiety</option>
        <option value="other">Other</option>
      </select>
      <label>Notes (optional)</label>
      <textarea id="rf-notes" placeholder="Any extra context for the counselling team"></textarea>
      <div class="error" id="rf-error" style="display:none;"></div>
      <div class="success" id="rf-success" style="display:none;"></div>
      <button class="primary" id="rf-submit">Submit request</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px;">Your submitted requests</h3>
      <div id="rf-list"><div class="empty">Loading…</div></div>
    </div>
  </div>`);

  const submitBtn = wrap.querySelector('#rf-submit');

  submitBtn.onclick = async () => {
    const sid = wrap.querySelector('#rf-sid').value.trim();
    const sname = wrap.querySelector('#rf-sname').value.trim();
    const level = wrap.querySelector('#rf-level').value.trim();
    const reason = wrap.querySelector('#rf-reason').value;
    const notes = wrap.querySelector('#rf-notes').value.trim();
    const errEl = wrap.querySelector('#rf-error');
    const okEl = wrap.querySelector('#rf-success');
    errEl.style.display = 'none'; okEl.style.display = 'none';

    if (!sid || !sname || !level){
      errEl.textContent = 'Student ID, name, and educational level are required.';
      errEl.style.display = 'block';
      return;
    }
    if (!STUDENT_ID_RE.test(sid)){
      errEl.textContent = 'Student ID should be at least 3 characters (letters, numbers, or dashes only).';
      errEl.style.display = 'block';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    const { error } = await sb.from('appointments').insert({
      student_number: sid,
      student_name: sname,
      educational_level: level,
      raised_by_id: currentProfile.id,
      raised_by_role: currentProfile.role,
      reason_category: reason,
      reason_notes: notes || null,
      status: 'pending'
    });
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit request';
    if (error){ errEl.textContent = error.message; errEl.style.display = 'block'; return; }
    okEl.textContent = 'Request submitted.';
    okEl.style.display = 'block';
    wrap.querySelector('#rf-sid').value = '';
    wrap.querySelector('#rf-sname').value = '';
    wrap.querySelector('#rf-level').value = '';
    wrap.querySelector('#rf-notes').value = '';
    loadMyRequests();
  };

  async function loadMyRequests(){
    const listEl = wrap.querySelector('#rf-list');
    listEl.innerHTML = `<div class="empty">Loading…</div>`;
    const { data, error } = await sb.from('appointments')
      .select('*')
      .eq('raised_by_id', currentProfile.id)
      .order('created_at', { ascending: false });
    if (error){ listEl.innerHTML = `<div class="error">${error.message}</div>`; return; }
    if (!data || data.length === 0){ listEl.innerHTML = `<div class="empty">No requests submitted yet.</div>`; return; }
    listEl.innerHTML = '';
    const table = el(`<table><thead><tr>
      <th>Student</th><th>Reason</th><th>Scheduled</th><th>Status</th><th></th>
    </tr></thead><tbody></tbody></table>`);
    const tbody = table.querySelector('tbody');
    data.forEach(a => {
      const row = el(`<tr>
        <td>${a.student_name}<br><span style="color:var(--muted);font-size:12px;">${a.student_number}</span></td>
        <td>${REASON_LABELS[a.reason_category]}</td>
        <td>${a.scheduled_date ? a.scheduled_date + ' ' + fmt(a.scheduled_time) : '—'}</td>
        <td>${statusPill(a.status)}</td>
        <td style="text-align:right;"></td>
      </tr>`);
      if (a.status === 'pending'){
        const cancelBtn = el(`<button style="font-size:12px; padding:6px 10px; color:var(--coral);">Cancel</button>`);
        cancelBtn.onclick = async () => {
          if (!confirm('Cancel this request?')) return;
          cancelBtn.disabled = true; cancelBtn.textContent = 'Cancelling…';
          const { error: cancelErr } = await sb.from('appointments').update({ status: 'cancelled' }).eq('id', a.id);
          if (cancelErr){ alert(cancelErr.message); cancelBtn.disabled = false; cancelBtn.textContent = 'Cancel'; return; }
          loadMyRequests();
        };
        row.querySelector('td:last-child').appendChild(cancelBtn);
      }
      tbody.appendChild(row);
    });
    listEl.appendChild(table);
  }

  loadMyRequests();
  return wrap;
}

// ---------- VIEW 2: COUNSELLING ADMIN DASHBOARD ----------
function AdminDashboardView(){
  const wrap = el(`<div>
    <div class="card">
      <h2 style="margin-bottom:4px;">Pending requests</h2>
      <p class="sub">Assign a counselor, date, and time to move a request to scheduled.</p>
      <div id="admin-pending"><div class="empty">Loading…</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px;">All appointments</h3>
      <div id="admin-all"><div class="empty">Loading…</div></div>
    </div>
  </div>`);

  let counselors = [];

  async function loadCounselors(){
    const { data } = await sb.from('profiles').select('id,name').eq('role', 'counselor');
    counselors = data || [];
  }

  async function loadPending(){
    const target = wrap.querySelector('#admin-pending');
    target.innerHTML = `<div class="empty">Loading…</div>`;
    const { data, error } = await sb.from('appointments').select('*').eq('status', 'pending').order('created_at');
    if (error){ target.innerHTML = `<div class="error">${error.message}</div>`; return; }
    if (!data || data.length === 0){ target.innerHTML = `<div class="empty">No pending requests.</div>`; return; }

    target.innerHTML = '';
    data.forEach(a => {
      const row = el(`<div class="card" style="margin-bottom:12px; padding:16px;">
        <div style="display:flex; justify-content:space-between; gap:16px;">
          <div>
            <strong>${a.student_name}</strong> <span style="color:var(--muted); font-size:13px;">(${a.student_number}, ${a.educational_level})</span>
            <div style="font-size:13px; color:var(--muted); margin-top:4px;">
              ${REASON_LABELS[a.reason_category]}${a.reason_notes ? ' — ' + a.reason_notes : ''}
            </div>
          </div>
          ${statusPill(a.status)}
        </div>
        <div class="assign-row">
          <div>
            <label>Counselor</label>
            <select class="assign-counselor">
              <option value="">Select…</option>
              ${counselors.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>Date</label>
            <input type="date" class="assign-date">
          </div>
          <div>
            <label>Time</label>
            <input type="time" class="assign-time">
          </div>
          <div style="flex:0;">
            <button class="primary assign-btn">Assign</button>
          </div>
        </div>
        <div class="error assign-error" style="display:none;"></div>
      </div>`);

      row.querySelector('.assign-btn').onclick = async () => {
        const counselor_id = row.querySelector('.assign-counselor').value;
        const scheduled_date = row.querySelector('.assign-date').value;
        const scheduled_time = row.querySelector('.assign-time').value;
        const errEl = row.querySelector('.assign-error');
        errEl.style.display = 'none';
        if (!counselor_id || !scheduled_date || !scheduled_time){
          errEl.textContent = 'Choose a counselor, date, and time.';
          errEl.style.display = 'block';
          return;
        }
        const counselorName = counselors.find(c => c.id === counselor_id)?.name || 'this counselor';
        if (!confirm(`Assign ${a.student_name} to ${counselorName} on ${scheduled_date} at ${scheduled_time}?`)) return;
        const assignBtn = row.querySelector('.assign-btn');
        assignBtn.disabled = true; assignBtn.textContent = 'Assigning…';
        const { error } = await sb.from('appointments').update({
          counselor_id, scheduled_date, scheduled_time, status: 'scheduled'
        }).eq('id', a.id);
        assignBtn.disabled = false; assignBtn.textContent = 'Assign';
        if (error){ errEl.textContent = error.message; errEl.style.display = 'block'; return; }
        loadPending();
        loadAll();
      };

      target.appendChild(row);
    });
  }

  async function loadAll(){
    const target = wrap.querySelector('#admin-all');
    target.innerHTML = `<div class="empty">Loading…</div>`;
    const { data, error } = await sb.from('appointments').select('*').order('created_at', { ascending: false }).limit(50);
    if (error){ target.innerHTML = `<div class="error">${error.message}</div>`; return; }
    if (!data || data.length === 0){ target.innerHTML = `<div class="empty">No appointments yet.</div>`; return; }
    target.innerHTML = '';
    const table = el(`<table><thead><tr>
      <th>Student</th><th>Reason</th><th>Scheduled</th><th>Status</th><th></th>
    </tr></thead><tbody></tbody></table>`);
    const tbody = table.querySelector('tbody');
    data.forEach(a => {
      const row = el(`<tr>
        <td>${a.student_name} <span style="color:var(--muted); font-size:12px;">(${a.student_number})</span></td>
        <td>${REASON_LABELS[a.reason_category]}</td>
        <td>${a.scheduled_date ? a.scheduled_date + ' ' + fmt(a.scheduled_time) : '—'}</td>
        <td>${statusPill(a.status)}</td>
        <td style="text-align:right;"></td>
      </tr>`);
      if (a.status === 'pending' || a.status === 'scheduled'){
        const cancelBtn = el(`<button style="font-size:12px; padding:6px 10px; color:var(--coral);">Cancel</button>`);
        cancelBtn.onclick = async () => {
          if (!confirm(`Cancel the appointment for ${a.student_name}?`)) return;
          cancelBtn.disabled = true; cancelBtn.textContent = 'Cancelling…';
          const { error: cancelErr } = await sb.from('appointments').update({ status: 'cancelled' }).eq('id', a.id);
          if (cancelErr){ alert(cancelErr.message); cancelBtn.disabled = false; cancelBtn.textContent = 'Cancel'; return; }
          loadPending();
          loadAll();
        };
        row.querySelector('td:last-child').appendChild(cancelBtn);
      }
      tbody.appendChild(row);
    });
    target.appendChild(table);
  }

  (async () => { await loadCounselors(); await loadPending(); await loadAll(); })();
  return wrap;
}

// ---------- VIEW 3: STUDENT ADMIN LIST ----------
function StudentAdminListView(){
  const wrap = el(`<div>
    <div class="card">
      <h2 style="margin-bottom:4px;">Students to send today</h2>
      <p class="sub">Scheduled appointments, ordered by date and time.</p>
      <div id="sa-list"><div class="empty">Loading…</div></div>
    </div>
  </div>`);

  async function load(){
    const target = wrap.querySelector('#sa-list');
    target.innerHTML = `<div class="empty">Loading…</div>`;
    const { data, error } = await sb.from('appointments')
      .select('*')
      .eq('status', 'scheduled')
      .order('scheduled_date').order('scheduled_time');
    if (error){ target.innerHTML = `<div class="error">${error.message}</div>`; return; }
    if (!data || data.length === 0){ target.innerHTML = `<div class="empty">No scheduled appointments.</div>`; return; }
    target.innerHTML = `<table><thead><tr>
      <th>Student ID</th><th>Name</th><th>Level</th><th>Date</th><th>Time</th>
    </tr></thead><tbody>${data.map(a => `
      <tr>
        <td>${a.student_number}</td>
        <td>${a.student_name}</td>
        <td>${a.educational_level}</td>
        <td>${a.scheduled_date}</td>
        <td>${a.scheduled_time}</td>
      </tr>`).join('')}</tbody></table>`;
  }

  load();
  return wrap;
}

// ---------- VIEW 4: COUNSELOR ----------
function CounselorView(){
  const wrap = el(`<div>
    <div class="card">
      <h2 style="margin-bottom:4px;">Your scheduled sessions</h2>
      <p class="sub">Fill in the outcome after each session to close it.</p>
      <div id="cs-scheduled"><div class="empty">Loading…</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px;">Closed sessions</h3>
      <div id="cs-closed"><div class="empty">Loading…</div></div>
    </div>
  </div>`);

  async function loadScheduled(){
    const target = wrap.querySelector('#cs-scheduled');
    target.innerHTML = `<div class="empty">Loading…</div>`;
    const { data, error } = await sb.from('appointments')
      .select('*')
      .eq('counselor_id', currentProfile.id)
      .eq('status', 'scheduled')
      .order('scheduled_date').order('scheduled_time');
    if (error){ target.innerHTML = `<div class="error">${error.message}</div>`; return; }
    if (!data || data.length === 0){ target.innerHTML = `<div class="empty">No scheduled sessions.</div>`; return; }

    target.innerHTML = '';
    data.forEach(a => {
      const row = el(`<div class="card" style="margin-bottom:12px; padding:16px;">
        <div style="display:flex; justify-content:space-between; gap:16px;">
          <div>
            <strong>${a.student_name}</strong> <span style="color:var(--muted); font-size:13px;">(${a.student_number}, ${a.educational_level})</span>
            <div style="font-size:13px; color:var(--muted); margin-top:4px;">
              ${a.scheduled_date} at ${a.scheduled_time} — ${REASON_LABELS[a.reason_category]}
            </div>
          </div>
          ${statusPill(a.status)}
        </div>
        <label style="margin-top:14px;">Diagnosis</label>
        <textarea class="cs-diagnosis"></textarea>
        <label>Solution</label>
        <textarea class="cs-solution"></textarea>
        <div class="error cs-error" style="display:none;"></div>
        <button class="primary cs-close-btn">Close session</button>
      </div>`);

      row.querySelector('.cs-close-btn').onclick = async () => {
        const diagnosis = row.querySelector('.cs-diagnosis').value.trim();
        const solution = row.querySelector('.cs-solution').value.trim();
        const errEl = row.querySelector('.cs-error');
        const closeBtn = row.querySelector('.cs-close-btn');
        errEl.style.display = 'none';
        if (!diagnosis || !solution){
          errEl.textContent = 'Diagnosis and solution are both required to close.';
          errEl.style.display = 'block';
          return;
        }
        closeBtn.disabled = true;
        closeBtn.textContent = 'Closing…';
        const { error: outcomeErr } = await sb.from('session_outcomes').insert({
          appointment_id: a.id, diagnosis, solution, closed_by_id: currentProfile.id
        });
        if (outcomeErr){
          errEl.textContent = outcomeErr.message; errEl.style.display = 'block';
          closeBtn.disabled = false; closeBtn.textContent = 'Close session';
          return;
        }
        const { error: updateErr } = await sb.from('appointments').update({ status: 'closed' }).eq('id', a.id);
        if (updateErr){
          errEl.textContent = updateErr.message; errEl.style.display = 'block';
          closeBtn.disabled = false; closeBtn.textContent = 'Close session';
          return;
        }
        loadScheduled();
        loadClosed();
      };

      target.appendChild(row);
    });
  }

  async function loadClosed(){
    const target = wrap.querySelector('#cs-closed');
    target.innerHTML = `<div class="empty">Loading…</div>`;
    const { data, error } = await sb.from('appointments')
      .select('*')
      .eq('counselor_id', currentProfile.id)
      .eq('status', 'closed')
      .order('scheduled_date', { ascending: false });
    if (error){ target.innerHTML = `<div class="error">${error.message}</div>`; return; }
    if (!data || data.length === 0){ target.innerHTML = `<div class="empty">No closed sessions yet.</div>`; return; }
    target.innerHTML = `<table><thead><tr>
      <th>Student</th><th>Date</th><th>Reason</th><th>Status</th>
    </tr></thead><tbody>${data.map(a => `
      <tr>
        <td>${a.student_name}</td>
        <td>${a.scheduled_date}</td>
        <td>${REASON_LABELS[a.reason_category]}</td>
        <td>${statusPill(a.status)}</td>
      </tr>`).join('')}</tbody></table>`;
  }

  loadScheduled();
  loadClosed();
  return wrap;
}

// ---------- EDGE FUNCTION HELPER ----------
async function callManageAccounts(payload){
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/manage-accounts`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${session.access_token}`
    },
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || 'Request failed');
  return json;
}

// ---------- VIEW 5: SUPERADMIN — MANAGE ACCOUNTS ----------
function SuperadminView(){
  const wrap = el(`<div>
    <div class="card">
      <h2 style="margin-bottom:4px;">Create account</h2>
      <p class="sub">New accounts are created here — there's no public sign-up.</p>
      <div class="field-row">
        <div>
          <label>Full name</label>
          <input type="text" id="ca-name">
        </div>
        <div>
          <label>Email</label>
          <input type="email" id="ca-email">
        </div>
      </div>
      <div class="field-row">
        <div>
          <label>Temporary password</label>
          <input type="text" id="ca-password">
        </div>
        <div>
          <label>Role</label>
          <select id="ca-role">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="counselling_admin">Counselling admin</option>
            <option value="student_admin">Student admin</option>
            <option value="counselor">Counselor</option>
            <option value="superadmin">Superadmin</option>
          </select>
        </div>
      </div>
      <div class="error" id="ca-error" style="display:none;"></div>
      <div class="success" id="ca-success" style="display:none;"></div>
      <button class="primary" id="ca-btn">Create account</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px;">All accounts</h3>
      <div id="sa-users"><div class="empty">Loading…</div></div>
    </div>
  </div>`);

  const createBtn = wrap.querySelector('#ca-btn');
  createBtn.onclick = async () => {
    const name = wrap.querySelector('#ca-name').value.trim();
    const email = wrap.querySelector('#ca-email').value.trim();
    const password = wrap.querySelector('#ca-password').value;
    const role = wrap.querySelector('#ca-role').value;
    const errEl = wrap.querySelector('#ca-error');
    const okEl = wrap.querySelector('#ca-success');
    errEl.style.display = 'none'; okEl.style.display = 'none';
    if (!name || !email || !password){
      errEl.textContent = 'Please fill in every field.'; errEl.style.display = 'block'; return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      errEl.textContent = 'Please enter a valid email address.'; errEl.style.display = 'block'; return;
    }
    if (password.length < 8){
      errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = 'block'; return;
    }
    createBtn.disabled = true;
    createBtn.textContent = 'Creating…';
    try {
      await callManageAccounts({ action: 'create', name, email, password, role });
      okEl.textContent = `Account created for ${email}.`;
      okEl.style.display = 'block';
      wrap.querySelector('#ca-name').value = '';
      wrap.querySelector('#ca-email').value = '';
      wrap.querySelector('#ca-password').value = '';
      loadUsers();
    } catch (e){
      errEl.textContent = e.message; errEl.style.display = 'block';
    } finally {
      createBtn.disabled = false;
      createBtn.textContent = 'Create account';
    }
  };

  async function loadUsers(){
    const target = wrap.querySelector('#sa-users');
    target.innerHTML = `<div class="empty">Loading…</div>`;
    try {
      const { users } = await callManageAccounts({ action: 'list' });
      if (!users || users.length === 0){ target.innerHTML = `<div class="empty">No accounts yet.</div>`; return; }
      target.innerHTML = '';
      const table = el(`<table><thead><tr>
        <th>Name</th><th>Email</th><th>Role</th><th></th>
      </tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      users.forEach(u => {
        const isSelf = u.id === currentProfile.id;
        const row = el(`<tr>
          <td>${u.name}${isSelf ? ' <span style="color:var(--muted); font-size:12px;">(you)</span>' : ''}</td>
          <td>${u.email || '—'}</td>
          <td>${ROLE_LABELS[u.role] || u.role}</td>
          <td style="text-align:right; white-space:nowrap;">
            <button class="reset-btn" style="font-size:12px; padding:6px 10px;">Reset password</button>
            <button class="delete-btn" style="font-size:12px; padding:6px 10px; color:var(--coral);" ${isSelf ? 'disabled title="You can\'t delete your own account"' : ''}>Delete</button>
          </td>
        </tr>`);
        const resetBtn = row.querySelector('.reset-btn');
        resetBtn.onclick = async () => {
          const newPw = prompt(`New password for ${u.email} (min 8 characters):`);
          if (!newPw) return;
          if (newPw.length < 8){ alert('Password must be at least 8 characters.'); return; }
          resetBtn.disabled = true; resetBtn.textContent = 'Resetting…';
          try {
            await callManageAccounts({ action: 'reset_password', user_id: u.id, new_password: newPw });
            alert('Password updated.');
          } catch (e){ alert(e.message); }
          resetBtn.disabled = false; resetBtn.textContent = 'Reset password';
        };
        if (!isSelf){
          const deleteBtn = row.querySelector('.delete-btn');
          deleteBtn.onclick = async () => {
            if (!confirm(`Delete the account for ${u.email}? This can't be undone.`)) return;
            deleteBtn.disabled = true; deleteBtn.textContent = 'Deleting…';
            try {
              await callManageAccounts({ action: 'delete', user_id: u.id });
              loadUsers();
            } catch (e){
              alert(e.message);
              deleteBtn.disabled = false; deleteBtn.textContent = 'Delete';
            }
          };
        }
        tbody.appendChild(row);
      });
      target.appendChild(table);
    } catch (e){
      target.innerHTML = `<div class="error">${e.message}</div>`;
    }
  }

  loadUsers();
  return wrap;
}

init();
</script>
