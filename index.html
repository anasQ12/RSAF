<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام RSAF الإرشادي — المواعيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Markazi+Text:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#F7F5F0;
    --surface:#FFFFFF;
    --border:#E4E1D8;
    --ink:#1F2A24;
    --muted:#6B6F6C;
    --teal:#2F6F62;
    --teal-light:#E4EFEC;
    --coral:#D97757;
    --coral-light:#FBEAE3;
    --amber:#B8873A;
    --amber-light:#F6EDDD;
    --slate:#5B6B76;
    --slate-light:#E9EEF0;
    --radius:10px;
    --font-display:'Markazi Text', serif;
    --font-body:'Cairo', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0;}
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; background:var(--surface); border-bottom:1px solid var(--border);
  }
  header.topbar h1{font-size:22px; letter-spacing:0;}
  .who{display:flex; align-items:center; gap:14px; font-size:14px; color:var(--muted);}
  .who strong{color:var(--ink); font-weight:600;}
  button{
    font-family:var(--font-body); font-size:14px; font-weight:600;
    border-radius:8px; border:1px solid var(--border); background:var(--surface);
    padding:9px 16px; cursor:pointer; color:var(--ink);
  }
  button.primary{background:var(--teal); color:#fff; border-color:var(--teal);}
  button.primary:hover{background:#255a4f;}
  button.ghost{background:transparent; border-color:transparent; color:var(--muted);}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  main{max-width:880px; margin:0 auto; padding:32px 24px 80px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:24px; margin-bottom:20px;
  }
  label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink);}
  input, select, textarea{
    width:100%; font-family:var(--font-body); font-size:14px;
    padding:10px 12px; border:1px solid var(--border); border-radius:8px;
    background:#fff; color:var(--ink); margin-bottom:16px;
  }
  textarea{resize:vertical; min-height:70px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .pill{
    display:inline-block; font-size:12px; font-weight:600; padding:3px 10px;
    border-radius:999px; white-space:nowrap;
  }
  .pill.pending{background:var(--slate-light); color:var(--slate);}
  .pill.scheduled{background:var(--amber-light); color:var(--amber);}
  .pill.closed{background:var(--teal-light); color:var(--teal);}
  .pill.cancelled{background:var(--coral-light); color:var(--coral);}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{
    text-align:start; font-weight:600; color:var(--muted); font-size:12px;
    letter-spacing:0.01em; padding:8px 10px;
    border-bottom:1px solid var(--border);
  }
  td{padding:12px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .empty{color:var(--muted); font-size:14px; padding:20px 0; text-align:center;}
  .error{color:var(--coral); font-size:13px; margin:-8px 0 12px;}
  .success{color:var(--teal); font-size:13px; margin:-8px 0 12px;}
  .sub{color:var(--muted); font-size:13px; margin-top:-4px; margin-bottom:20px;}
  .assign-row{display:flex; gap:10px; align-items:end; flex-wrap:wrap; margin-top:10px;}
  .assign-row > div{flex:1; min-width:120px;}
  .assign-row input, .assign-row select{margin-bottom:0;}
  .center-screen{display:flex; align-items:center; justify-content:center; min-height:90vh;}
  .auth-card{width:380px;}
  .role-badge{
    font-size:11px; letter-spacing:0.02em;
    color:var(--muted); font-weight:700; margin-bottom:2px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const SUPABASE_URL = 'https://twtlfjepxqxdtyiztmxq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XaAK7GnIlR4B9m4ggq8F-g_TGcH2iDR';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROLE_LABELS = {
  student: 'طالب',
  teacher: 'معلم',
  counselling_admin: 'إدارة الإرشاد',
  student_admin: 'إدارة شؤون الطلاب',
  counselor: 'مرشد',
  superadmin: 'المشرف العام'
};
const REASON_LABELS = {
  emotional_wellbeing: 'الصحة النفسية',
  anxiety: 'القلق',
  other: 'أخرى'
};
const STATUS_LABELS = {
  pending: 'قيد الانتظار',
  scheduled: 'مجدولة',
  completed: 'مكتملة',
  closed: 'مغلقة',
  cancelled: 'ملغاة'
};

let currentUser = null;
let currentProfile = null;

const app = document.getElementById('app');

function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function fmt(v){ return v ? v : '—'; }
function statusPill(status){ return `<span class="pill ${status}">${STATUS_LABELS[status] || status}</span>`; }

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (session){
    currentUser = session.user;
    await loadProfile();
  }
  render();
}

async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if (!error && data) currentProfile = data;
}

sb.auth.onAuthStateChange(async (_event, session) => {
  currentUser = session ? session.user : null;
  if (currentUser) await loadProfile(); else currentProfile = null;
  render();
});

function render(){
  app.innerHTML = '';
  if (!currentUser){
    app.appendChild(renderAuthScreen());
    return;
  }
  if (!currentProfile){
    app.appendChild(renderCompleteProfileScreen());
    return;
  }
  app.appendChild(renderShell());
}

// ---------- تسجيل الدخول ----------
function renderAuthScreen(){
  const wrap = el(`<div class="center-screen"><div class="card auth-card">
    <h3 style="margin-bottom:16px;">تسجيل الدخول</h3>
    <label>البريد الإلكتروني</label>
    <input type="email" id="login-email">
    <label>كلمة المرور</label>
    <input type="password" id="login-password">
    <div class="error" id="login-error" style="display:none;"></div>
    <button class="primary" id="login-btn" style="width:100%;">تسجيل الدخول</button>
    <p class="sub" style="margin-top:16px; margin-bottom:0;">ليس لديك حساب؟ يرجى التواصل مع مسؤول النظام لإنشاء حساب لك.</p>
  </div></div>`);

  wrap.querySelector('#login-btn').onclick = async () => {
    const email = wrap.querySelector('#login-email').value.trim();
    const password = wrap.querySelector('#login-password').value;
    const errEl = wrap.querySelector('#login-error');
    errEl.style.display = 'none';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error){ errEl.textContent = error.message; errEl.style.display = 'block'; return; }
    currentUser = (await sb.auth.getUser()).data.user;
    await loadProfile();
    render();
  };
  return wrap;
}

function renderCompleteProfileScreen(){
  // الجلسة موجودة لكن لا يوجد ملف شخصي مرتبط بها — لا يُفترض أن يحدث هذا عادة
  // لأن الحسابات تُنشأ مع ملف شخصي في خطوة واحدة من قبل المشرف العام.
  const wrap = el(`<div class="center-screen"><div class="card auth-card">
    <h3 style="margin-bottom:12px;">لم يتم إعداد الحساب بالكامل</h3>
    <p class="sub" style="margin-bottom:16px;">تم تسجيل الدخول بنجاح، ولكن لا يوجد ملف شخصي مرتبط بهذا الحساب بعد. يرجى التواصل مع مسؤول النظام.</p>
    <button class="ghost" id="cp-signout" style="width:100%;">تسجيل الخروج</button>
  </div></div>`);
  wrap.querySelector('#cp-signout').onclick = async () => {
    await sb.auth.signOut();
    currentUser = null; currentProfile = null;
    render();
  };
  return wrap;
}

// ---------- تغيير كلمة المرور (لجميع الأدوار) ----------
function openChangePasswordModal(onSuccess){
  const overlay = el(`<div style="position:fixed; inset:0; background:rgba(31,42,34,0.4); display:flex; align-items:center; justify-content:center; z-index:1000;">
    <div class="card" style="width:360px;">
      <h3 style="margin-bottom:16px;">تغيير كلمة المرور</h3>
      <label>كلمة المرور الجديدة</label>
      <input type="password" id="cpw-new">
      <label>تأكيد كلمة المرور الجديدة</label>
      <input type="password" id="cpw-confirm">
      <div class="error" id="cpw-error" style="display:none;"></div>
      <div style="display:flex; gap:10px;">
        <button class="primary" id="cpw-save" style="flex:1;">حفظ</button>
        <button class="ghost" id="cpw-cancel">إلغاء</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  overlay.querySelector('#cpw-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#cpw-save').onclick = async () => {
    const pw1 = overlay.querySelector('#cpw-new').value;
    const pw2 = overlay.querySelector('#cpw-confirm').value;
    const errEl = overlay.querySelector('#cpw-error');
    errEl.style.display = 'none';
    if (pw1.length < 8){ errEl.textContent = 'يجب ألا تقل كلمة المرور عن 8 أحرف.'; errEl.style.display = 'block'; return; }
    if (pw1 !== pw2){ errEl.textContent = 'كلمتا المرور غير متطابقتين.'; errEl.style.display = 'block'; return; }
    const saveBtn = overlay.querySelector('#cpw-save');
    saveBtn.disabled = true; saveBtn.textContent = 'جارٍ الحفظ…';
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error){ errEl.textContent = error.message; errEl.style.display = 'block'; saveBtn.disabled = false; saveBtn.textContent = 'حفظ'; return; }
    await sb.from('profiles').update({ must_change_password: false }).eq('id', currentProfile.id);
    overlay.remove();
    if (onSuccess) onSuccess();
  };
}

// ---------- الهيكل العام ----------
function renderShell(){
  const wrap = el(`<div>
    <header class="topbar">
      <h1>الإرشاد الطلابي — RSAF</h1>
      <div class="who">
        <div style="text-align:end;">
          <div class="role-badge">${ROLE_LABELS[currentProfile.role]}</div>
          <strong>${currentProfile.name}</strong>
        </div>
        <button class="ghost" id="change-pw-btn">تغيير كلمة المرور</button>
        <button class="ghost" id="logout-btn">تسجيل الخروج</button>
      </div>
    </header>
    <main id="main"></main>
  </div>`);

  wrap.querySelector('#change-pw-btn').onclick = () => {
    openChangePasswordModal(async () => {
      await loadProfile();
      render();
    });
  };

  wrap.querySelector('#logout-btn').onclick = async () => {
    await sb.auth.signOut();
    currentUser = null; currentProfile = null;
    render();
  };

  const main = wrap.querySelector('#main');

  if (currentProfile.must_change_password){
    const banner = el(`<div class="card" style="background:var(--amber-light); border-color:var(--amber); display:flex; justify-content:space-between; align-items:center; gap:16px;">
      <div style="font-size:14px;">أنت تستخدم كلمة مرور مؤقتة. يرجى تغييرها في أقرب وقت ممكن.</div>
      <button class="primary" id="banner-change-pw" style="white-space:nowrap;">تغيير كلمة المرور</button>
    </div>`);
    banner.querySelector('#banner-change-pw').onclick = () => {
      openChangePasswordModal(async () => {
        await loadProfile();
        render();
      });
    };
    main.appendChild(banner);
  }

  const role = currentProfile.role;
  if (role === 'student' || role === 'teacher') main.appendChild(RequestFormView());
  else if (role === 'counselling_admin') main.appendChild(AdminDashboardView());
  else if (role === 'student_admin') main.appendChild(StudentAdminListView());
  else if (role === 'counselor') main.appendChild(CounselorView());
  else if (role === 'superadmin') main.appendChild(SuperadminView());
  else main.appendChild(el(`<div class="card">لا توجد واجهة مخصصة لهذا الدور بعد.</div>`));

  return wrap;
}

// ---------- الواجهة 1: طلب جلسة (طالب / معلم) ----------
const STUDENT_ID_RE = /^[A-Za-z0-9-]{3,}$/;

function RequestFormView(){
  const isTeacher = currentProfile.role === 'teacher';

  const wrap = el(`<div>
    <div class="card">
      <h2 style="margin-bottom:4px;">طلب جلسة إرشادية</h2>
      <p class="sub">${isTeacher ? "ابحث عن الطالب، أو أدخل بياناته يدويًا." : "تم تعبئة بياناتك تلقائيًا أدناه — يمكنك تعديلها إذا لزم الأمر."}</p>
      ${isTeacher ? `
      <label>البحث عن طالب بالرقم التعريفي</label>
      <div style="display:flex; gap:10px;">
        <input type="text" id="rf-teacher-search" placeholder="الرقم التعريفي للطالب" style="margin-bottom:0;">
        <button id="rf-teacher-search-btn" style="white-space:nowrap;">بحث</button>
      </div>
      <div id="rf-teacher-search-results" style="margin:10px 0 6px;"></div>
      <hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">
      ` : ''}
      <div class="field-row">
        <div>
          <label>الرقم التعريفي للطالب</label>
          <input type="text" id="rf-sid" ${!isTeacher ? 'readonly' : ''}>
        </div>
        <div>
          <label>اسم الطالب</label>
          <input type="text" id="rf-sname" ${!isTeacher ? 'readonly' : ''}>
        </div>
      </div>
      <label>المستوى الدراسي</label>
      <input type="text" id="rf-level" placeholder="مثال: السنة الثانية، تأسيسي، إلخ." ${!isTeacher ? 'readonly' : ''}>
      <label>سبب الجلسة</label>
      <select id="rf-reason">
        <option value="emotional_wellbeing">الصحة النفسية</option>
        <option value="anxiety">القلق</option>
        <option value="other">أخرى</option>
      </select>
      <label>ملاحظات (اختياري)</label>
      <textarea id="rf-notes" placeholder="أي معلومات إضافية لفريق الإرشاد"></textarea>
      <div class="error" id="rf-error" style="display:none;"></div>
      <div class="success" id="rf-success" style="display:none;"></div>
      <button class="primary" id="rf-submit">إرسال الطلب</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px;">طلباتك المُرسلة</h3>
      <div id="rf-list"><div class="empty">جارٍ التحميل…</div></div>
    </div>
  </div>`);

  const sidInput = wrap.querySelector('#rf-sid');
  const snameInput = wrap.querySelector('#rf-sname');
  const levelInput = wrap.querySelector('#rf-level');

  if (!isTeacher){
    // تعبئة تلقائية من ملف الطالب الشخصي، مع إمكانية التعديل عبر رابط "تعديل هذه البيانات" أدناه.
    sidInput.value = currentProfile.student_number || '';
    snameInput.value = currentProfile.name || '';
    levelInput.value = currentProfile.educational_level || '';
    const editNote = el(`<p class="sub" style="margin-top:-10px;">تم التعبئة تلقائيًا من حسابك. <a href="#" id="rf-edit-toggle" style="color:var(--teal);">تعديل هذه البيانات</a></p>`);
    wrap.querySelector('.card').insertBefore(editNote, wrap.querySelector('.field-row'));
    editNote.querySelector('#rf-edit-toggle').onclick = (e) => {
      e.preventDefault();
      [sidInput, snameInput, levelInput].forEach(i => i.removeAttribute('readonly'));
      editNote.remove();
    };
  } else {
    const searchInput = wrap.querySelector('#rf-teacher-search');
    const searchBtn = wrap.querySelector('#rf-teacher-search-btn');
    const resultsEl = wrap.querySelector('#rf-teacher-search-results');
    async function runTeacherSearch(){
      const term = searchInput.value.trim();
      if (!term){ resultsEl.innerHTML = ''; return; }
      resultsEl.innerHTML = `<div class="empty">جارٍ البحث…</div>`;
      const { data, error } = await sb.from('profiles')
        .select('id,name,student_number,educational_level')
        .eq('role', 'student')
        .ilike('student_number', `%${term}%`)
        .limit(10);
      if (error){ resultsEl.innerHTML = `<div class="error">${error.message}</div>`; return; }
      if (!data || data.length === 0){
        resultsEl.innerHTML = `<div class="empty">لا يوجد حساب طالب مطابق. يمكنك إدخال بياناته يدويًا أدناه.</div>`;
        return;
      }
      resultsEl.innerHTML = '';
      data.forEach(s => {
        const opt = el(`<div style="padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; cursor:pointer; font-size:14px;">
          <strong>${s.name}</strong> <span style="color:var(--muted);">(${s.student_number || '—'}${s.educational_level ? '، ' + s.educational_level : ''})</span>
        </div>`);
        opt.onclick = () => {
          sidInput.value = s.student_number || '';
          snameInput.value = s.name || '';
          levelInput.value = s.educational_level || '';
          resultsEl.innerHTML = '';
          searchInput.value = '';
        };
        resultsEl.appendChild(opt);
      });
    }
    searchBtn.onclick = runTeacherSearch;
    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); runTeacherSearch(); } });
  }

  const submitBtn = wrap.querySelector('#rf-submit');

  submitBtn.onclick = async () => {
    const sid = sidInput.value.trim();
    const sname = snameInput.value.trim();
    const level = levelInput.value.trim();
    const reason = wrap.querySelector('#rf-reason').value;
    const notes = wrap.querySelector('#rf-notes').value.trim();
    const errEl = wrap.querySelector('#rf-error');
    const okEl = wrap.querySelector('#rf-success');
    errEl.style.display = 'none'; okEl.style.display = 'none';

    if (!sid || !sname || !level){
      errEl.textContent = 'الرقم التعريفي واسم الطالب والمستوى الدراسي كلها مطلوبة.';
      errEl.style.display = 'block';
      return;
    }
    if (!STUDENT_ID_RE.test(sid)){
      errEl.textContent = 'يجب أن يتكون الرقم التعريفي من 3 أحرف على الأقل (حروف أو أرقام أو شرطات فقط).';
      errEl.style.display = 'block';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'جارٍ الإرسال…';
    const { error } = await sb.from('appointments').insert({
      student_number: sid,
      student_name: sname,
      educational_level: level,
      raised_by_id: currentProfile.id,
      raised_by_role: currentProfile.role,
      reason_category: reason,
      reason_notes: notes || null,
      status: 'pending'
    });
    submitBtn.disabled = false;
    submitBtn.textContent = 'إرسال الطلب';
    if (error){ errEl.textContent = error.message; errEl.style.display = 'block'; return; }
    okEl.textContent = 'تم إرسال الطلب.';
    okEl.style.display = 'block';
    if (isTeacher){
      sidInput.value = ''; snameInput.value = ''; levelInput.value = '';
    }
    wrap.querySelector('#rf-notes').value = '';
    loadMyRequests();
  };

  async function loadMyRequests(){
    const listEl = wrap.querySelector('#rf-list');
    listEl.innerHTML = `<div class="empty">جارٍ التحميل…</div>`;
    const { data, error } = await sb.from('appointments')
      .select('*')
      .eq('raised_by_id', currentProfile.id)
      .order('created_at', { ascending: false });
    if (error){ listEl.innerHTML = `<div class="error">${error.message}</div>`; return; }
    if (!data || data.length === 0){ listEl.innerHTML = `<div class="empty">لا توجد طلبات مُرسلة بعد.</div>`; return; }
    listEl.innerHTML = '';
    const table = el(`<table><thead><tr>
      <th>الطالب</th><th>السبب</th><th>الموعد</th><th>الحالة</th><th></th>
    </tr></thead><tbody></tbody></table>`);
    const tbody = table.querySelector('tbody');
    data.forEach(a => {
      const row = el(`<tr>
        <td>${a.student_name}<br><span style="color:var(--muted);font-size:12px;">${a.student_number}</span></td>
        <td>${REASON_LABELS[a.reason_category]}</td>
        <td>${a.scheduled_date ? a.scheduled_date + ' ' + fmt(a.scheduled_time) : '—'}</td>
        <td>${statusPill(a.status)}</td>
        <td style="text-align:end;"></td>
      </tr>`);
      if (a.status === 'pending'){
        const cancelBtn = el(`<button style="font-size:12px; padding:6px 10px; color:var(--coral);">إلغاء</button>`);
        cancelBtn.onclick = async () => {
          if (!confirm('هل تريد إلغاء هذا الطلب؟')) return;
          cancelBtn.disabled = true; cancelBtn.textContent = 'جارٍ الإلغاء…';
          const { error: cancelErr } = await sb.from('appointments').update({ status: 'cancelled' }).eq('id', a.id);
          if (cancelErr){ alert(cancelErr.message); cancelBtn.disabled = false; cancelBtn.textContent = 'إلغاء'; return; }
          loadMyRequests();
        };
        row.querySelector('td:last-child').appendChild(cancelBtn);
      }
      tbody.appendChild(row);
    });
    listEl.appendChild(table);
  }

  loadMyRequests();
  return wrap;
}

            <input type="date" class="assign-date">

          <div>
            <label>الوقت</label>
            <input type="time" class="assign-time">

        </div>

        const scheduled_date = row.querySelector('.assign-date').value;
        const scheduled_time = row.querySelector('.assign-time').value;
        const errEl = row.querySelector('.assign-error');

        if (!counselor_id || !scheduled_date || !scheduled_time){
          errEl.textContent = 'يرجى اختيار المرشد والتاريخ والوقت.';
          errEl.style.display = 'block';

        }
        const counselorName = counselors.find(c => c.id === counselor_id)?.name || 'هذا المرشد';
        if (!confirm(`هل تريد تعيين ${a.student_name} إلى ${counselorName} بتاريخ ${scheduled_date} الساعة ${scheduled_time}؟`)) return;
        const assignBtn = row.querySelector('.assign-btn');

        loadPending();

        <td style="text-align:end;"></td>
      </tr>`);

        const cancelBtn = el(`<button style="font-size:12px; padding:6px 10px; color:var(--coral);">إلغاء</button>`);

          if (!confirm(`هل تريد إلغاء موعد ${a.student_name}؟`)) return;

          const { error: cancelErr } = await sb.from('appointments').update({ status: 'cancelled' }).eq('id', a.id);

        };
        row.querySelector('td:last-child').appendChild(cancelBtn);
      }
      tbody.appendChild(row);
    });
    target.appendChild(table);
  }

  (async () => { await loadCounselors(); await loadPending(); await loadAll(); })();
  return wrap;
}

    target.innerHTML = `<table><thead><tr>
      <th>الرقم التعريفي</th><th>الاسم</th><th>المستوى</th><th>التاريخ</th><th>الوقت</th>${opts.showStatus ? '<th>الحالة</th>' : ''}

        <td>${a.student_name}</td>
        <td>${a.educational_level}</td>
        <td>${fmt(a.scheduled_date)}</td>
        <td>${fmt(a.scheduled_time)}</td>

    resultsTarget.innerHTML = '';

    const target = wrap.querySelector('#sa-list');

    renderResultsTable(target, data, { emptyText: 'لا توجد مواعيد مجدولة.', showStatus: false });

}

// ---------- دالة استدعاء وظيفة إدارة الحسابات ----------
async function callManageAccounts(payload){
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/manage-accounts`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${session.access_token}`
    },
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || 'حدث خطأ أثناء تنفيذ الطلب');
  return json;
}

      complete: async (parsed) => {
        const rows = parsed.data.map(r => ({
          student_id: r.student_id || r['Student ID'] || '',
          name: r.name || r['Name'] || '',
          email: r.email || r['Email'] || '',
          educational_level: r.educational_level || r['Educational Level'] || ''
        }));
        if (rows.length === 0){
          errEl.textContent = 'لم يتم العثور على أي بيانات في هذا الملف.'; errEl.style.display = 'block';
          bulkBtn.disabled = false; bulkBtn.textContent = 'رفع';
          return;
        }
        bulkBtn.textContent = `جارٍ رفع ${rows.length} صف…`;
        try {
          const result = await callManageAccounts({ action: 'bulk_create_students', students: rows, password });
          const failedRows = result.results.filter(r => !r.success);
          resultsEl.innerHTML = `<div class="success" style="margin-bottom:10px;">تم إنشاء ${result.created_count} حساب${result.failed_count ? `، وفشل ${result.failed_count}` : ''}.</div>`;
          if (failedRows.length > 0){
            const table = el(`<table><thead><tr><th>الصف</th><th>البريد الإلكتروني</th><th>السبب</th></tr></thead><tbody>${
              failedRows.map(r => `<tr><td>${r.row}</td><td>${r.email || '—'}</td><td>${r.error}</td></tr>`).join('')
            }</tbody></table>`);
            resultsEl.appendChild(table);
          }
          fileInput.value = '';
          loadUsers();
        } catch (e){
          errEl.textContent = e.message; errEl.style.display = 'block';
        } finally {
          bulkBtn.disabled = false;
          bulkBtn.textContent = 'رفع';
        }
      },
      error: (err) => {
        errEl.textContent = err.message; errEl.style.display = 'block';
        bulkBtn.disabled = false; bulkBtn.textContent = 'رفع';
      }
    });
  };

  async function loadUsers(){
    const target = wrap.querySelector('#sa-users');
    target.innerHTML = `<div class="empty">جارٍ التحميل…</div>`;
    try {
      const { users } = await callManageAccounts({ action: 'list' });
      if (!users || users.length === 0){ target.innerHTML = `<div class="empty">لا توجد حسابات بعد.</div>`; return; }
      target.innerHTML = '';
      const table = el(`<table><thead><tr>
        <th>الاسم</th><th>البريد الإلكتروني</th><th>الدور</th><th></th>
      </tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      users.forEach(u => {
        const isSelf = u.id === currentProfile.id;
        const row = el(`<tr>
          <td>${u.name}${isSelf ? ' <span style="color:var(--muted); font-size:12px;">(أنت)</span>' : ''}</td>
          <td>${u.email || '—'}</td>
          <td>${ROLE_LABELS[u.role] || u.role}${u.must_change_password ? ' <span class="pill scheduled" style="margin-left:4px;">كلمة مرور مؤقتة</span>' : ''}</td>
          <td style="text-align:end; white-space:nowrap;">
            <button class="reset-btn" style="font-size:12px; padding:6px 10px;">إعادة تعيين كلمة المرور</button>
            <button class="delete-btn" style="font-size:12px; padding:6px 10px; color:var(--coral);" ${isSelf ? 'disabled title="لا يمكنك حذف حسابك الخاص"' : ''}>حذف</button>
          </td>
        </tr>`);
        const resetBtn = row.querySelector('.reset-btn');
        resetBtn.onclick = async () => {
          const newPw = prompt(`كلمة مرور جديدة لـ ${u.email} (8 أحرف على الأقل):`);
          if (!newPw) return;
          if (newPw.length < 8){ alert('يجب ألا تقل كلمة المرور عن 8 أحرف.'); return; }
          resetBtn.disabled = true; resetBtn.textContent = 'جارٍ إعادة التعيين…';
          try {
            await callManageAccounts({ action: 'reset_password', user_id: u.id, new_password: newPw });
            alert('تم تحديث كلمة المرور.');
          } catch (e){ alert(e.message); }
          resetBtn.disabled = false; resetBtn.textContent = 'إعادة تعيين كلمة المرور';
        };
        if (!isSelf){
          const deleteBtn = row.querySelector('.delete-btn');
          deleteBtn.onclick = async () => {
            if (!confirm(`هل تريد حذف حساب ${u.email}؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
            deleteBtn.disabled = true; deleteBtn.textContent = 'جارٍ الحذف…';
            try {
              await callManageAccounts({ action: 'delete', user_id: u.id });
              loadUsers();
            } catch (e){
              alert(e.message);
              deleteBtn.disabled = false; deleteBtn.textContent = 'حذف';
            }
          };
        }
        tbody.appendChild(row);
      });
      target.appendChild(table);
    } catch (e){
      target.innerHTML = `<div class="error">${e.message}</div>`;
    }
  }

  loadUsers();
  return wrap;
}

init();
</script>
</body>
</html>
